name: Update daily reading

on:
  workflow_dispatch:
  schedule:
    - cron: '20 16 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: node scripts/update-daily-reading.js
      - name: Save the new reading
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-reading.json
          git diff --cached --quiet || git commit -m "Update daily reading"
          git push
